<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pimentel · Prueba</title><link rel="apple-touch-icon" href="/apple-touch-icon.png"><style>body{background:#101010;color:white;font:16px system-ui;margin:0}main{max-width:700px;margin:auto;padding:20px}h1,h2{color:#edc652}section{background:#242424;border-radius:12px;padding:18px;margin:18px 0}#trips>section,#myTrips>section{border:2px solid #edc652;background:#242424;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 0 0 1px rgba(237,198,82,.12)}[hidden]{display:none!important}label{display:block;margin:12px 0}input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #777}button{background:#edc652;color:#171717;border:0;border-radius:8px;padding:13px 17px;font-weight:700;margin:8px 5px 8px 0}button:disabled{opacity:.5}#deleteCompleted{background:#c62828;color:#fff;border:2px solid #ff7777}#deleteCompleted:focus-visible{outline:3px solid #fff;outline-offset:3px}#msg{white-space:pre-wrap}small{color:#ccc}</style></head><body><main><h1>Pimentel · Prueba de iPad</h1><p>Usa datos ficticios. Elige Conductor y prueba escribir 1 y 0000.</p><section id="login"><h2>Acceso</h2><label>Tipo de acceso<select id="role"><option value="admin">Administrador</option><option value="driver">Conductor</option></select></label><label id="driverField" hidden>Número de conductor<input id="driverId" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next"></label><label id="passwordField">Contraseña de administrador<input id="password" type="password" autocomplete="current-password"></label><label id="pinField" hidden>PIN de cuatro dígitos<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label><button id="loginBtn">Entrar</button></section><p id="status" role="status"></p><div id="trips" hidden><section>Viaje de prueba 1</section><section>Viaje de prueba 2</section></div><div id="myTrips" hidden><section>Viaje asignado de prueba 1</section><section>Viaje asignado de prueba 2</section></div></main><script>const el=id=>document.getElementById(id);el('role').onchange=()=>{const d=el('role').value==='driver';el('driverField').hidden=!d;el('pinField').hidden=!d;el('passwordField').hidden=d;el('trips').hidden=true;el('myTrips').hidden=true;el('status').textContent='';};el('loginBtn').onclick=()=>{const driver=el('role').value==='driver';if(driver&&(el('driverId').value!=='1'||el('pin').value!=='0000')){el('status').textContent='Escribe el número 1 y el PIN ficticio 0000.';return;}el('trips').hidden=driver;el('myTrips').hidden=!driver;el('pin').value='';el('password').value='';el('status').textContent='Prueba completada.';};</script></body></html>
