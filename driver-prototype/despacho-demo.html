<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pimentel — Despacho DEMO</title><style>body{background:#101010;color:white;font:16px Arial,sans-serif;margin:0;padding:1rem}h1{color:#f4ce39}section{border:1px solid #b99a33;border-radius:10px;padding:1rem;margin:1rem 0}input,select,button{display:block;margin:.5rem 0;padding:.7rem;max-width:100%;font:inherit}button{background:#f4ce39;border:0;border-radius:5px}small{color:#ccc}.driver{border-top:1px solid #555;padding:.8rem 0}</style></head><body><h1>PIMENTEL TRANSPORTATION</h1><strong>DEMOSTRACIÓN LOCAL — NO USAR PARA VIAJES REALES</strong><section><h2>Administrador: asignación manual</h2><label>Pasajero <input id="passenger" value="John Smith"></label><label>Recogida <input id="pickup" value="Logan Airport, Boston"></label><label>Destino <input id="destination" value="Woburn, MA"></label><label>Tarifa (solo vista administrativa) <input id="fare" type="number" value="125"></label><label>Conductor <select id="driver"><option>Ana</option><option>Luis</option></select></label><button id="assign">Asignar viaje</button><div id="admin"></div></section><section><h2>Vista simulada del conductor</h2><label>Ver como <select id="viewer"><option>Ana</option><option>Luis</option></select></label><div id="driverTrips"></div><small>Esta pantalla es una simulación: no incluye autenticación ni protección de datos.</small></section><script>const trips=[];const el=id=>document.getElementById(id);function render(){el('admin').textContent='Viajes asignados: '+trips.length;const mine=trips.filter(t=>t.driver===el('viewer').value);el('driverTrips').replaceChildren();for(const t of mine){const div=document.createElement('div');div.className='driver';const info=document.createElement('p');info.textContent=t.passenger+' — '+t.pickup+' → '+t.destination;div.append(info);const nav=document.createElement('a');nav.textContent='Abrir navegación';nav.target='_blank';nav.rel='noopener noreferrer';nav.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(t.destination);div.append(nav);const sign=document.createElement('button');sign.textContent='Mostrar cartel';sign.onclick=()=>{const url='cartel.html';window.open(url,'_blank','noopener')};div.append(sign);el('driverTrips').append(div)}}el('assign').onclick=()=>{if(!el('passenger').value.trim()||!el('pickup').value.trim()||!el('destination').value.trim())return alert('Completa los datos del viaje');trips.push({passenger:el('passenger').value.trim(),pickup:el('pickup').value.trim(),destination:el('destination').value.trim(),driver:el('driver').value});render()};el('viewer').onchange=render;render();</script></body></html>
