<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pimentel | Cartel de bienvenida</title><style>html,body{margin:0;background:#000;color:white;font-family:Arial,sans-serif;height:100%}main{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:1rem;box-sizing:border-box}h1{color:#f2ce33;font-size:clamp(1.1rem,4vw,2.5rem);letter-spacing:.12em}#surname{font-weight:800;font-size:clamp(3rem,13vw,10rem);overflow-wrap:anywhere}button,input{font-size:1.2rem;padding:.7rem;border-radius:.4rem}button{background:#f2ce33;color:#000;border:0}input{max-width:75vw}#controls{display:flex;gap:.6rem;align-items:center;justify-content:center;flex-wrap:wrap}#sign{display:none}body.show #controls{display:none}body.show #sign{display:flex}#close{position:absolute;bottom:1rem;right:1rem}</style></head><body><main><section id="controls"><label>Apellido del pasajero <input id="name" autocomplete="off" maxlength="70" placeholder="SMITH"></label><button id="open">Mostrar cartel</button><p>Prototipo independiente. No contiene reservas ni datos reales.</p></section><section id="sign" style="flex-direction:column;align-items:center;justify-content:center"><h1>PIMENTEL TRANSPORTATION</h1><div id="surname"></div><button id="close">Cerrar cartel</button></section></main><script>const nameInput=document.querySelector('#name');document.querySelector('#open').onclick=async()=>{const value=nameInput.value.trim();if(!value){nameInput.focus();return}document.querySelector('#surname').textContent=value.toLocaleUpperCase();document.body.classList.add('show');try{await document.documentElement.requestFullscreen?.()}catch{}};document.querySelector('#close').onclick=async()=>{document.body.classList.remove('show');try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}};</script></body></html>
