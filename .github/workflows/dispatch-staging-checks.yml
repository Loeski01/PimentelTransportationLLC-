name: Dispatch staging checks
on:
  push:
    branches:
      - feature/dispatch-security-review-20261029
    paths:
      - 'dispatch/**'
      - '.github/workflows/dispatch-staging-checks.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'dispatch/**'
      - '.github/workflows/dispatch-staging-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dispatch dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and run no-show tests
        run: npm run check
