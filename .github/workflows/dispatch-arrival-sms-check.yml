name: Dispatch arrival SMS checks
on:
  push:
    branches:
      - feature/arrival-sms-production-safe-20261124
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dispatch/package-lock.json
      - run: npm ci
      - run: npm run check
