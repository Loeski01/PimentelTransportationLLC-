name: Dispatch cleanup preview checks
on:
  push:
    branches:
      - feature/dispatch-test-cleanup-preview-20261109
  pull_request:
    paths:
      - 'dispatch/**'
      - '.github/workflows/dispatch-cleanup-preview.yml'
permissions:
  contents: read
jobs:
  dispatch-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
