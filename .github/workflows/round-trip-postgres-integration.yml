name: Isolated PostgreSQL booking integration
on:
  push:
    branches: [feature/round-trip-10pct]
    paths:
      - 'round-trip/**'
      - 'dispatch/booking-staging-router.js'
      - 'dispatch/router.js'
      - 'dispatch/private-panel.html'
      - 'dispatch/tests/booking-release.test.js'
      - '.github/workflows/round-trip-postgres-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test database driver
        run: npm install --no-save --package-lock=false pg
      - name: Run PostgreSQL integration checks
        run: node round-trip/postgres-integration.test.js
      - name: Verify dispatch booking boundaries with PostgreSQL service available
        run: |
          node --test dispatch/tests/booking-release.test.js
          node --test dispatch/tests/booking-acceptance.test.js
