<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas | Pimentel</title><style>body{background:#111;color:#f8f4e8;font:16px system-ui;margin:auto;max-width:780px;padding:24px}h1{color:#d8b45c}.booking{border:1px solid #8c753b;border-radius:12px;padding:16px;margin:14px 0}button,a{background:#d8b45c;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:700}button:disabled{opacity:.5}.archive{display:block;margin-top:12px;background:#47221f;color:#ffddd6;border:1px solid #a65e53}p{overflow-wrap:anywhere}</style><h1>Pimentel · Reservas</h1><p><a href="/panel">Volver a despacho</a> <button id="refresh">Actualizar</button></p><p id="message">Cargando...</p><div id="list"></div><section id="roundTrips" hidden><h2>Round trips / Ida y vuelta</h2><div id="roundTripList"></div></section><script>
const bookingBase=__BOOKING_API_BASE__;
const list=document.getElementById('list'),message=document.getElementById('message');
function element(tag,value){const e=document.createElement(tag);e.textContent=String(value??'');return e}
function archiveButton(base, reference, card){
 const button=element('button','Remove from inbox / Quitar de la bandeja');
 button.className='archive';
 button.onclick=async()=>{
  if(!confirm('¿Quitar la reserva '+reference+' de esta bandeja? La reserva quedará guardada y los viajes en despacho conservarán su estado.'))return;
  button.disabled=true;
  try{
   const result=await fetch(base+'/'+encodeURIComponent(reference)+'/archive-inbox',{method:'POST',credentials:'same-origin'});
   if(!result.ok)throw Error('No se pudo quitar la reserva ('+result.status+').');
  }catch(error){message.textContent=error.message;button.disabled=false;return}
  card.remove();
  try{
   await load();
   message.textContent='Reserva '+reference+' retirada de la bandeja.';
  }catch{
   message.textContent='Reserva '+reference+' retirada. Pulsa Actualizar para recargar la bandeja.';
  }
 };
 return button;
}
async function loadRoundTrips(){
 const base=bookingBase+'/round-trip';
 const response=await fetch(base+'/inbox',{cache:'no-store'});
 const section=document.getElementById('roundTrips');
 if(response.status===404){section.hidden=true;return}
 if(!response.ok)throw Error('No se pudieron cargar las reservas de ida y vuelta.');
 const {bookings,editLinksAvailable}=await response.json();
 const container=document.getElementById('roundTripList');
 container.replaceChildren();
 section.hidden=!bookings.length;
 for(const b of bookings){
  const card=element('section','');card.className='booking';
  const {from,to,date,time}=b.outbound;
  card.append(element('h3',b.reference+' · '+b.customer_name),
   element('p','Outbound / Ida · '+from+' → '+to+' · '+date+' '+time),
   element('p','Return / Regreso · '+to+' → '+from+' · '+b.return_leg.date+' '+b.return_leg.time),
   element('p','Fare / Tarifa · $'+(Number(b.fare_cents)/100).toFixed(2)),
   element('p','Estado del correo: '+b.acceptance_notice_status));
  function action(label,path,success){
   const button=element('button',label);
   button.onclick=async()=>{
    if(!confirm(label+' · '+b.reference+'?'))return;
    button.disabled=true;
    try{
     const url=base+'/'+encodeURIComponent(b.reference)+'/'+path;
     const result=await fetch(url,{method:'POST'});
     if(!result.ok)throw Error(result.status===409?'Comprueba el estado de ambos trayectos o si ya se solicitó el envío.':'No se pudo verificar la operación ('+result.status+').');
     await load();
     message.textContent=success;
    }catch(error){message.textContent=error.message;button.disabled=false}
   };
   card.append(button,document.createTextNode(' '));
  }
  if(b.status==='pending'){
   action('Send both legs to dispatch / Enviar ambos trayectos','send-to-dispatch','Ambos trayectos están en despacho y requieren aprobación manual.');
   if(editLinksAvailable)action('Email edit link / Enviar enlace de modificación','email-edit-link','El proveedor aceptó el correo con el enlace.');
  }
  if(b.status==='dispatched'&&['pending','failed'].includes(b.acceptance_notice_status)){
   action('Send confirmation / Enviar confirmación','confirm','El proveedor aceptó el correo de confirmación.');
  }
  card.append(archiveButton(base,b.reference,card));
  container.append(card);
 }
}
async function load(){
 const response=await fetch(bookingBase+'/inbox',{credentials:'same-origin',cache:'no-store'});
 if(response.status===403){message.textContent='Inicia sesión como administrador en el panel.';return}
 if(!response.ok)throw Error('No se pudieron cargar las reservas ('+response.status+')');
 const records=await response.json();list.replaceChildren();
 for(const b of records){
  const card=element('section','');card.className='booking';
  card.append(element('h3',b.reference),element('p',b.passenger_name+' · '+b.pickup_local_date+' '+b.pickup_local_time),
   element('p',b.pickup_address+' → '+b.destination_address),
   element('p',b.fare_cents===null?'Tarifa pendiente de cotización':'Tarifa estimada: $'+(b.fare_cents/100).toFixed(2)),
   element('p','Estado: '+b.status));
  if(b.special_instructions)card.append(element('p',b.special_instructions));
  const button=element('button',b.status==='received'?'Enviar a despacho':'Enviado a despacho');
  button.disabled=b.status!=='received'||b.fare_cents===null;
  button.onclick=async()=>{
   if(!confirm('¿Enviar '+b.reference+' a despacho?'))return;
   button.disabled=true;message.textContent='Enviando...';
   try{const r=await fetch(bookingBase+'/' +encodeURIComponent(b.reference)+'/send-to-dispatch',{method:'POST',credentials:'same-origin'});if(!r.ok)throw Error('No se pudo transferir ('+r.status+')');await load()}catch(e){message.textContent=e.message}
  };
  const accept=element('button',b.acceptance_notice_status==='sent'?'Aceptación enviada':b.acceptance_notice_status==='failed'?'Reintentar correo de aceptación':'Aceptar y notificar al cliente');
  accept.disabled=b.fare_cents===null||b.status==='cancelled'||['sent','sending','unknown'].includes(b.acceptance_notice_status);
  accept.onclick=async()=>{
   if(!confirm('¿Aceptar '+b.reference+' y enviar un correo de confirmación al cliente? La asignación del conductor seguirá siendo manual.'))return;
   accept.disabled=true;message.textContent='Aceptando y enviando correo...';
   try{
    const path=bookingBase+'/'+encodeURIComponent(b.reference);
    if(b.status==='received'){
     const transfer=await fetch(path+'/send-to-dispatch',{method:'POST',credentials:'same-origin'});
     if(!transfer.ok)throw Error('No se pudo transferir la reserva ('+transfer.status+')');
    }
    const response=await fetch(path+'/accept-and-notify',{method:'POST',credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok)throw Error(data.error||'No se pudo confirmar el envío');
    await load();message.textContent='Reserva aprobada. Correo de aceptación enviado al proveedor; la entrega al buzón del cliente aún puede demorar.';
   }catch(e){await load().catch(()=>{});message.textContent=e.message}
  };
  if(b.fare_cents===null&&b.status==='received'){
   const input=element('input','');input.type='number';input.min='0.01';input.step='0.01';input.placeholder='Tarifa USD';input.setAttribute('aria-label','Tarifa en dólares');
   const save=element('button','Guardar tarifa / Save fare');
   save.onclick=async()=>{
    if(!/^\d+(\.\d{1,2})?$/.test(input.value)||Number(input.value)<=0){message.textContent='Escribe una tarifa válida en dólares.';return}
    const fareCents=Math.round(Number(input.value)*100);
    if(!confirm('¿Guardar tarifa de $'+(fareCents/100).toFixed(2)+'? Esto no confirma ni cobra el viaje.'))return;
    save.disabled=true;
    try{const r=await fetch(bookingBase+'/'+encodeURIComponent(b.reference)+'/quote',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({fareCents})});if(!r.ok)throw Error('No se pudo guardar la tarifa');await load()}catch(e){message.textContent=e.message;save.disabled=false}
   };
   card.append(input,save,element('p','Define la tarifa antes de aprobar. No se ha realizado ningún cobro.'));
  }
  card.append(button,document.createTextNode(' '),accept);
  if(['sending','unknown'].includes(b.acceptance_notice_status))card.append(element('p','Envío en curso o incierto: verifica el correo antes de reenviar.'));
  card.append(archiveButton(bookingBase,b.reference,card));
  list.append(card);
 }
 await loadRoundTrips();
 message.textContent=records.length?'Reservas: '+records.length:'No hay reservas todavía';
}
document.getElementById('refresh').onclick=()=>load().catch(e=>message.textContent=e.message);
load().catch(e=>message.textContent=e.message);
</script></html>
