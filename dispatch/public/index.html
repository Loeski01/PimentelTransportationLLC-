<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest">
<title>Conductores | Pimentel Transportation</title>
<style>
*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}main{max-width:640px;margin:auto}h1,h2{color:#d4af37}section{background:#202020;border:1px solid #66551e;border-radius:12px;padding:20px;margin:20px 0}label{display:block;margin:14px 0}input{width:100%;padding:13px;border-radius:6px;border:1px solid #aaa;font-size:16px}button{padding:12px 16px;background:#d4af37;border:0;border-radius:6px;font-weight:bold;margin:5px;cursor:pointer}button:disabled{opacity:.5}article{border-top:1px solid #555;padding:14px 0}small{color:#ccc}#notice{min-height:25px}a{color:#e5c45a}
</style></head><body><main><h1>Pimentel Transportation</h1><p>Portal privado de conductores</p>
<section id="loginPanel"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<section id="tripsPanel" hidden><h2>Mis viajes asignados</h2><button id="refresh">Actualizar</button><button id="logout">Salir</button><div id="trips"></div></section>
<p id="notice" role="status" aria-live="polite"></p><small>Solo verás los viajes que el administrador te asigne. Las reservas requieren confirmación.</small></main>
<script>
(()=>{'use strict';
let token=null;const $=id=>document.getElementById(id);const notice=msg=>$('notice').textContent=msg;
async function request(path,options={}){const response=await fetch('/api/dispatch'+path,{...options,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(options.headers||{})},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Error del servidor');return data;}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function load(){const rows=await request('/my-assignments');$('trips').replaceChildren();if(!rows.length){$('trips').append(node('p','No tienes viajes asignados.'));return;}
for(const trip of rows){const card=node('article','');for(const line of ['Reserva: '+trip.reference,'Recogida: '+trip.pickup,'Destino: '+trip.destination,'Fecha: '+new Date(trip.pickup_at).toLocaleString('es-US'),'Estado: '+(trip.booking_status==='in_progress'?'En curso':trip.status)])card.append(node('p',line));
if(trip.status==='offered'){for(const [status,label] of [['accepted','Aceptar'],['rejected','Rechazar']]){const btn=node('button',label);btn.onclick=async()=>{btn.disabled=true;try{await request('/my-assignments/'+encodeURIComponent(trip.id)+'/respond',{method:'POST',body:JSON.stringify({status})});await load();}catch(e){notice(e.message);btn.disabled=false;}};card.append(btn);}}
if(trip.status==='accepted'&&trip.booking_status==='assigned'){const btn=node('button','Iniciar viaje');btn.onclick=async()=>{btn.disabled=true;try{await request('/my-assignments/'+encodeURIComponent(trip.id)+'/start',{method:'POST'});notice('Viaje iniciado.');await load();}catch(e){notice(e.message);btn.disabled=false;}};card.append(btn);}
if(trip.status==='accepted'&&trip.booking_status==='in_progress'){const btn=node('button','Marcar viaje completado');btn.onclick=async()=>{if(!confirm('¿Confirmas que este viaje ha terminado?'))return;btn.disabled=true;try{await request('/my-assignments/'+encodeURIComponent(trip.id)+'/complete',{method:'POST'});notice('Viaje marcado como completado.');await load();}catch(e){notice(e.message);btn.disabled=false;}};card.append(btn);}
$('trips').append(card);}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.currentTarget);notice('Iniciando sesión…');try{const result=await request('/login',{method:'POST',body:JSON.stringify({email:data.get('email'),password:data.get('password')})});token=result.token;$('loginPanel').hidden=true;$('tripsPanel').hidden=false;e.currentTarget.reset();await load();notice('Sesión iniciada.');}catch(err){notice(err.message);}});
$('refresh').onclick=()=>load().catch(e=>notice(e.message));
$('logout').onclick=async()=>{try{await request('/logout',{method:'POST'});}catch(e){notice('No se pudo confirmar el cierre en el servidor.');}finally{token=null;$('tripsPanel').hidden=true;$('loginPanel').hidden=false;$('trips').replaceChildren();notice('Sesión cerrada en este dispositivo.');}};
})();
</script></body></html>
