<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pimentel — Despacho</title><style>body{background:#101010;color:white;font:16px system-ui;margin:0}main{max-width:700px;margin:auto;padding:20px}h1,h2{color:#edc652}section{background:#242424;border-radius:12px;padding:18px;margin:18px 0}label{display:block;margin:12px 0}input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:5px;border-radius:6px;border:1px solid #777}button{background:#edc652;color:#171717;border:0;border-radius:8px;padding:13px 17px;font-weight:700;margin:8px 5px 8px 0}button:disabled{opacity:.5}#msg{white-space:pre-wrap}small{color:#ccc}</style></head><body><main><h1>Pimentel Transportation</h1><p>Panel de despacho — servidor privado. No se conecta con la página de reservas ni pagos.</p><section id="login"><h2>Acceso</h2><label>Tipo de acceso<select id="role"><option value="admin">Administrador</option><option value="driver">Conductor</option></select></label><label id="driverField" hidden>Número de conductor<input id="driverId" type="number" min="1" autocomplete="off"></label><label id="passwordField">Contraseña de administrador<input id="password" type="password" autocomplete="current-password"></label><label id="pinField" hidden>PIN de cuatro dígitos<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label><button id="loginBtn">Entrar</button></section><section id="admin" hidden><h2>Crear viaje</h2><label>Apellido<input id="surname" maxlength="250"></label><label>Recogida<input id="pickup" maxlength="250"></label><label>Destino<input id="destination" maxlength="250"></label><label>Fecha y hora<input id="pickupAt" type="datetime-local"></label><button id="create">Crear viaje pendiente</button><h2>Nuevo conductor</h2><label>Nombre<input id="newDriverName" maxlength="100"></label><label>PIN (4 números)<input id="newDriverPin" type="password" inputmode="numeric" maxlength="4"></label><button id="addDriver">Registrar conductor</button><div id="driversList"></div><h2>Viajes</h2><button id="refreshAdmin">Actualizar</button><div id="trips"></div></section><section id="driver" hidden><h2>Mis viajes asignados</h2><button id="refreshDriver">Actualizar</button><div id="myTrips"></div></section><section id="session" hidden><button id="logout">Cerrar sesión</button></section><p id="msg" role="status"></p></main><script>
const el=id=>document.getElementById(id),msg=s=>el('msg').textContent=s;const api=async(path,method='GET',data)=>{const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},credentials:'same-origin',body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('Solicitud fallida ('+r.status+')');return r.status===204?null:r.json()};const safe=s=>String(s??'');const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=safe(text);return e};const button=(label,fn)=>{const b=node('button',label);b.onclick=fn;return b};const act=async(fn)=>{try{msg('');await fn()}catch(e){msg(e.message)}};el('role').onchange=()=>{const d=el('role').value==='driver';el('driverField').hidden=!d;el('pinField').hidden=!d;el('passwordField').hidden=d};el('loginBtn').onclick=()=>act(async()=>{const role=el('role').value;await api('/auth/login','POST',role==='admin'?{role,password:el('password').value}:{role,driverId:Number(el('driverId').value),pin:el('pin').value});el('password').value='';el('pin').value='';el('login').hidden=true;el('session').hidden=false;el(role).hidden=false;await(role==='admin'?loadAdmin():loadDriver())});el('logout').onclick=()=>act(async()=>{await api('/auth/logout','POST');location.reload()});el('addDriver').onclick=()=>act(async()=>{await api('/dispatch/admin/drivers','POST',{displayName:el('newDriverName').value,pin:el('newDriverPin').value});el('newDriverName').value='';el('newDriverPin').value='';msg('Conductor registrado');await loadAdmin()});el('create').onclick=()=>act(async()=>{await api('/dispatch/admin/trips','POST',{passengerSurname:el('surname').value,pickupAddress:el('pickup').value,destinationAddress:el('destination').value,pickupAt:el('pickupAt').value?new Date(el('pickupAt').value).toISOString():null});msg('Viaje creado, pendiente de aprobación');await loadAdmin()});async function loadAdmin(){const [trips,drivers]=await Promise.all([api('/dispatch/admin/trips'),api('/dispatch/admin/drivers')]);el('driversList').replaceChildren();for(const d of drivers){const row=node('p',d.display_name+' — ID '+d.id+' — '+(d.active?'Activo':'Inactivo'));if(d.active)row.append(button('Desactivar',()=>act(async()=>{if(!confirm('¿Desactivar a '+d.display_name+'?'))return;await api('/dispatch/admin/drivers/'+d.id+'/deactivate','POST');msg('Conductor desactivado');await loadAdmin()})));el('driversList').append(row)};el('trips').replaceChildren();for(const t of trips){const box=node('section',t.passenger_surname+' — '+t.pickup_address+' → '+t.destination_address+' — '+t.status);if(t.status==='pending')box.append(button('Aprobar',()=>act(async()=>{await api('/dispatch/admin/trips/'+t.id+'/approve','POST');await loadAdmin()})));if(t.status==='pending')box.append(button('Rechazar',()=>act(async()=>{if(!confirm('¿Rechazar este viaje pendiente?'))return;await api('/dispatch/admin/trips/'+t.id+'/reject','POST');await loadAdmin()})));if(t.status==='approved'){const sel=document.createElement('select');for(const d of drivers.filter(d=>d.active)){const o=document.createElement('option');o.value=d.id;o.textContent=d.display_name;sel.append(o)}box.append(sel,button('Asignar',()=>act(async()=>{await api('/dispatch/admin/trips/'+t.id+'/assign','POST',{driverId:Number(sel.value)});await loadAdmin()})))}if(['pending','approved','assigned','accepted'].includes(t.status))box.append(button('Cancelar viaje',()=>act(async()=>{if(!confirm('¿Cancelar este viaje?'))return;await api('/dispatch/admin/trips/'+t.id+'/cancel','POST');await loadAdmin()})));el('trips').append(box)}}async function loadDriver(){const trips=await api('/dispatch/driver/trips');el('myTrips').replaceChildren();for(const t of trips){const box=node('section',t.passenger_surname+' — '+t.pickup_address+' → '+t.destination_address+' — '+t.status);const navigation=document.createElement('div');navigation.append(node('p','Navegación:'));const navLink=(label,url)=>{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;a.style.cssText='display:inline-block;color:#edc652;margin:6px 14px 6px 0';navigation.append(a)};const pickup=encodeURIComponent(t.pickup_address),destination=encodeURIComponent(t.destination_address);navLink('Google Maps · recogida','https://www.google.com/maps/dir/?api=1&destination='+pickup+'&travelmode=driving');navLink('Google Maps · destino','https://www.google.com/maps/dir/?api=1&destination='+destination+'&travelmode=driving');navLink('Apple Maps · recogida','https://maps.apple.com/?daddr='+pickup+'&dirflg=d');navLink('Apple Maps · destino','https://maps.apple.com/?daddr='+destination+'&dirflg=d');navLink('Waze · recogida','https://waze.com/ul?q='+pickup+'&navigate=yes');navLink('Waze · destino','https://waze.com/ul?q='+destination+'&navigate=yes');box.append(navigation);const sign=button('Cartel de bienvenida',()=>{const w=window.open('','_blank');if(!w){msg('Permite ventanas emergentes para ver el cartel');return}const doc=w.document;doc.title='Bienvenida';doc.body.style.cssText='background:black;color:white;text-align:center;font-family:system-ui;padding-top:12vh';doc.body.append(node('h2','PIMENTEL TRANSPORTATION'),node('h1',t.passenger_surname.toUpperCase()));doc.querySelector('h1').style.fontSize='15vw';doc.querySelector('h2').style.color='#edc652'});box.append(sign);const transitions={assigned:['accepted','rejected'],accepted:['started'],started:['completed']};for(const s of transitions[t.status]||[])box.append(button(({accepted:'Aceptar viaje',rejected:'Rechazar viaje',started:'Iniciar viaje',completed:'Finalizar viaje'})[s],()=>act(async()=>{if(['rejected','completed'].includes(s)&&!confirm(s==='rejected'?'¿Rechazar este viaje?':'¿Confirmar que finalizó el viaje?'))return;await api('/dispatch/driver/trips/'+t.id+'/status','POST',{status:s});await loadDriver()})));el('myTrips').append(box)}}el('refreshAdmin').onclick=()=>act(loadAdmin);el('refreshDriver').onclick=()=>act(loadDriver);
</script></body></html>
